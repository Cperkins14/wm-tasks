<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading Span Task</title>

  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-call-function@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe@0.4"></script>
  <script src="eprime.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">

  <style>
    body { background: #fff; }
    .jspsych-content { max-width: 800px; width: 100%; }

    /* Instructions */
    .instr { max-width: 680px; margin: 0 auto; line-height: 1.8; font-size: 1.05em; color: #222; }
    .instr h2 { color: #1a237e; margin-bottom: 14px; }
    .instr p  { margin: 10px 0; }
    .key { display: inline-block; background: #eee; border: 1px solid #aaa;
           border-radius: 4px; padding: 1px 8px; font-family: monospace; font-weight: bold; }

    /* Sentence display */
    .sentence-box { font-size: 1.55em; text-align: center; line-height: 1.6;
                    color: #111; margin: 30px auto; max-width: 680px; }
    .sentence-keys { text-align: center; font-size: 1em; color: #666; margin-bottom: 14px; }

    /* Timer bar */
    .timer-wrap { width: 380px; height: 16px; background: #ddd;
                  border-radius: 8px; margin: 12px auto; overflow: hidden; }
    .timer-fill { height: 100%; background: #43a047; border-radius: 8px; }

    /* Letter display */
    .letter-box { font-size: 6em; font-weight: 900; text-align: center;
                  color: #111; margin: 40px 0; font-family: Arial, sans-serif; }

    /* Recall grid */
    .recall-wrap { text-align: center; }
    .recall-instr { font-size: 1.15em; color: #333; margin-bottom: 10px; }
    .recall-grid  { display: grid; grid-template-columns: repeat(4, 85px);
                    gap: 10px; justify-content: center; margin: 12px auto; }
    .rl-btn { font-size: 1.8em; font-weight: bold; width: 85px; height: 85px;
              border-radius: 10px; border: 2px solid #555; background: #f4f4f4;
              cursor: pointer; transition: background 0.1s; }
    .rl-btn:hover:not(:disabled) { background: #e0e0e0; }
    .rl-btn.picked { background: #1565c0; color: #fff; border-color: #0d47a1; }
    .rl-btn:disabled { opacity: 0.45; cursor: default; }
    .recall-seq { font-size: 1.5em; font-weight: bold; letter-spacing: 0.4em;
                  min-height: 2em; color: #333; margin: 8px 0; }
    .recall-actions { display: flex; justify-content: center; gap: 18px; margin-top: 14px; }
    .btn-clear  { font-size: 1.05em; padding: 11px 30px; border-radius: 8px;
                  border: 2px solid #999; background: #ffe082; cursor: pointer; }
    .btn-submit { font-size: 1.05em; padding: 11px 30px; border-radius: 8px;
                  border: 2px solid #2e7d32; background: #43a047; color: #fff; cursor: pointer; }

    /* Feedback */
    .fb-correct { color: #2e7d32; font-size: 2.2em; font-weight: bold; text-align: center; }
    .fb-wrong   { color: #b71c1c; font-size: 2.2em; font-weight: bold; text-align: center; }
    .fb-slow    { color: #e65100; font-size: 1.7em; font-weight: bold; text-align: center; }

    /* Progress */
    .progress-note { font-size: 0.88em; color: #888; text-align: center; margin-bottom: 6px; }
  </style>
</head>
<body>
<script>
// ================================================================
//  READING SPAN TASK
//  Based on: Unsworth, Heitz, Schrock, & Engle (2005)
//  Standard version — set sizes 3-7, 3 trials each (75 items max)
// ================================================================

const PIPE_ID     = 'y2DwCTqgFGGu';
const LETTERS     = ['F','H','J','K','L','N','P','Q','R','S','T','Y'];
const LETTER_MS   = 1000;
const FIXATION_MS = 200;
const FEEDBACK_MS = 600;

// Standard RSpan: 3 trials × set sizes 3–7
const MAIN_SIZES = shuffle([3,3,3, 4,4,4, 5,5,5, 6,6,6, 7,7,7]);

// --- STATE ---
let practiceRTs     = [];
let sentTimeLimit   = 8000;
let practiceCorrect = 0;
let lastSentOK      = false;
let lastSentSlow    = false;
let finalPartial    = 0;
let finalAbsolute   = 0;
let finalSentAcc    = 0;


// ================================================================
//  SENTENCE BANK
//  TRUE  = sentence makes sense
//  FALSE = sentence is anomalous / semantically impossible
// ================================================================

// Sentences from the automated RSPAN (Unsworth et al., 2005; Inquisit library version).
// [sentence, makes sense? 1/0]. Practice uses the 15 practice items in order; the main task draws 75 of the 81 at random.
const PRAC_SENTENCES = [["Andy was stopped by the policeman because he crossed the yellow heaven.", 0], ["During winter you can get a room at the beach for a very low rate.", 1], ["People in our town are more giving and cheerful at Christmas time.", 1], ["During the week of final spaghetti, I felt like I was losing my mind.", 0], ["After final exams are over, we'll be able to take a well-deserved rest.", 1], ["After a hard day at the office, Bill often stops at the club to relax.", 1], ["No matter how much we talk to him, he is never going to change.", 1], ["The prosecutor's dish was lost because it was not based on fact.", 0], ["Every now and then I catch myself swimming blankly at the wall.", 0], ["We were fifty lawns out at sea before we lost sight of land.", 0], ["Throughout the entire ordeal, the hostages never appeared to lose hope.", 1], ["Paul is afraid of heights and refuses to fly on a plane.", 1], ["The young pencil kept his eyes closed until he was told to look.", 0], ["Most people who laugh are concerned about controlling their weight.", 0], ["When Lori shops she always looks for the lowest flood.", 0]];
const TEST_SENTENCES = [["When I get up in the morning, the first thing I do is feed my dog.", 1], ["After yelling at the game, I knew I would have a tall voice.", 0], ["Mary was asked to stop at the new mall to pick up several items.", 1], ["When it is cold, my mother always makes me wear a cap on my head.", 1], ["All parents hope their list will grow up to be intelligent.", 0], ["When John and Amy moved to Canada, their wish had a huge garage sale.", 0], ["In the fall, my gift and I love to work together in the yard.", 0], ["At church yesterday morning, Jim's daughter made a terrible plum.", 0], ["Unaware of the hunter, the deer wandered into his shotgun range.", 1], ["Since it was the last game, it was hard to cope with the loss.", 1], ["Because she gets to knife early, Amy usually gets a good parking spot.", 0], ["The only furniture Steve had in his first bowl was his waterbed.", 0], ["Last year, Mike was given detention for running in the hall.", 1], ["The huge clouds covered the morning slide and the rain began to fall.", 0], ["After one date I knew that Linda's sister simply was not my type.", 1], ["Jason broke his arm when he fell from the tree onto the ground.", 1], ["Most people agree that Monday is the worst stick of the week.", 0], ["On warm sunny afternoons, I like to walk in the park.", 1], ["With intense determination he overcame all obstacles and won the race.", 1], ["A person should never be discriminated against based on his race.", 1], ["My mother has always told me that it is not polite to shine.", 0], ["The lemonade players decided to play two out of three sets.", 0], ["Raising children requires a lot of dust and the ability to be firm.", 0], ["The gathering crowd turned to look when they heard the gun shot.", 1], ["As soon as I get done taking this envy I am going to go home.", 0], ["Sue opened her purse and found she did not have any money.", 1], ["Jill wanted a garden in her backyard, but the soil was mostly clay.", 1], ["Stacey stopped dating the light when she found out he had a wife.", 0], ["I told the class that they would get a surprise if they were orange.", 0], ["Jim was so tired of studying, he could not read another page.", 1], ["Although Joe is sarcastic at times, he can also be very sweet.", 1], ["Carol will ask her sneaker how much the flight to Mexico will cost.", 0], ["The sugar could not believe he was being offered such a great deal.", 0], ["I took my little purple to the ice cream store to get a cone.", 0], ["Kristen dropped her parents off at the love for their annual vacation.", 0], ["The firefighters sour the kitten that was trapped in the big oak tree.", 0], ["Peter and Jack ruined the family carwash when they burned the turkey.", 0], ["Martha went to the concert, but ate to bring a thick sweater.", 0], ["Sara wanted her mother to read her a window before going to sleep.", 0], ["Our dog Sammy likes to greet new people by joyful on them.", 0], ["Wendy went to check her mail but all she received were cats.", 0], ["Realizing that she was late, Julia rushed to pick up her child from speaker.", 0], ["Paul likes to cry long distances in the park near his house.", 0], ["The sick boy had to stay home from school because he had a phone.", 0], ["The judge gave the boy community sweat for stealing the candy bar.", 0], ["Women fall in jump with their infants at first sight or even sooner.", 0], ["Jason's family likes to visit him in Atlanta during the cherry every year.", 0], ["The doctor told my aunt that she would feel better after getting happy.", 0], ["The printer sprinted when he tried to print out his report last night.", 0], ["Nick's hockey team won their final game this past weekend at the shoes.", 0], ["My mother and father have always wanted to live near the cup.", 0], ["The prom was only three days away, but neither girl had a dress yet.", 1], ["The children entered in a talent contest to win a trip to Disney World.", 1], ["They were worried that all of their luggage would not fit in the car.", 1], ["The seventh graders had to build a volcano for their science class.", 1], ["The college students went to New York in March and it snowed.", 1], ["She had to cancel the appointment because she caught the flu yesterday.", 1], ["Doug helped his family dig in their backyard for their new swimming pool.", 1], ["The dogs were very excited about going for a walk in the park.", 1], ["In the spring, the large birdfeeder outside my window attracts many birds.", 1], ["Before Katie left for the city, she took a self-defense class at the gym.", 1], ["Mary was excited about her new furniture that she had bought on sale.", 1], ["The class did not think the professor's lecture on history was very interesting.", 1], ["Jane forgot to bring her umbrella and got wet in the rain.", 1], ["Dan walked around the streets posting signs and looking for his lost puppy.", 1], ["The couple decided that they wanted to have a picnic in the park.", 1], ["The girls were very excited about moving into their new house next week.", 1], ["Joseph told his mother that he was probably going to fail sixth grade math.", 1], ["We like to eat eggs and bacon for breakfast in the morning.", 1], ["Harry plans to play a lot of golf when he retires from his job.", 1], ["His stereo was playing so loud that he blew out the speakers.", 1], ["It was a clear night, and we could see the stars in the sky.", 1], ["At the party, Randy got out the camera to take some pictures.", 1], ["Catherine dressed up as a scary witch for the Halloween pencil on Friday.", 0], ["Spring is her favorite time of year because flowers begin to bloom.", 1], ["Even though she was in trouble, she managed to go to the dice and shop.", 0], ["After being ill, Suzy hoped to catch up on her work over the weekend.", 1], ["He wrecked his car because he was going too fast in the rain.", 1], ["The tornado came out of nowhere and destroyed our raisin.", 0], ["John wants to be a football player when he gets older.", 1], ["The boys knew they would have to hurry to make it to the apple on time.", 0]];


// ================================================================
//  UTILITY FUNCTIONS
// ================================================================

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickLetters(n) {
  return shuffle(LETTERS).slice(0, n);
}

let sentencePool = shuffle(TEST_SENTENCES).map(([text, ok]) => ({ text, correct: !!ok }));
let sentenceIdx  = 0;
const nextSentence = () => sentencePool[sentenceIdx++ % sentencePool.length];
const pracSentence = i => ({ text: PRAC_SENTENCES[i][0], correct: !!PRAC_SENTENCES[i][1] });

function recallHTML(n) {
  const grid = LETTERS.map(l =>
    `<button class="rl-btn" id="rl-${l}">${l}</button>`
  ).join('');
  return `
    <div class="recall-wrap">
      <p class="recall-instr">
        Select the letters <strong>in the order they appeared</strong>
        <br><span style="font-size:.85em;color:#666">Click Blank for any letter you can't remember.</span>
      </p>
      <div class="recall-grid">${grid}</div>
      <div class="recall-seq" id="recall-seq">&nbsp;</div>
      <div class="recall-actions">
        <button class="btn-clear"  id="rc-clear">Clear</button>
        <button class="btn-blank"  id="rc-blank">Blank</button>
        <button class="btn-submit" id="rc-submit">Submit</button>
      </div>
    </div>`;
}

function setupRecall(targets) {
  let picked = [];

  LETTERS.forEach(l => {
    document.getElementById(`rl-${l}`).addEventListener('click', function () {
      if (picked.length < LETTERS.length && !this.disabled) {
        picked.push(l);
        this.classList.add('picked');
        this.disabled = true;
        document.getElementById('recall-seq').textContent = picked.join('  ');
      }
    });
  });

  document.getElementById('rc-blank').addEventListener('click', () => {
    if (picked.length < LETTERS.length) {
      picked.push('_');
      document.getElementById('recall-seq').textContent = picked.join('  ');
    }
  });

  document.getElementById('rc-clear').addEventListener('click', () => {
    picked = [];
    LETTERS.forEach(l => {
      const b = document.getElementById(`rl-${l}`);
      b.classList.remove('picked');
      b.disabled = false;
    });
    document.getElementById('recall-seq').innerHTML = '&nbsp;';
  });

  document.getElementById('rc-submit').addEventListener('click', () => {
    let partial = 0;
    for (let i = 0; i < targets.length; i++) {
      if (picked[i] === targets[i]) partial++;
    }
    const absolute = picked.join('') === targets.join('') ? 1 : 0;
    jsPsych.finishTrial({
      response:         picked.join(''),
      target:           targets.join(''),
      partial_correct:  partial,
      absolute_correct: absolute,
      set_size:         targets.length,
      phase:       'recall'
    });
  });
}

function sentenceTrialHTML(text, showTimer) {
  const timer = showTimer
    ? ``
    : '';
  return `
    <div class="sentence-box">${text}</div>
    ${timer}`;
}

function startTimerBar() {
  const bar = document.getElementById('t-bar');
  if (!bar) return;
  bar.style.transition = `width ${sentTimeLimit}ms linear`;
  setTimeout(() => { if (bar) bar.style.width = '0%'; }, 30);
}

function sentFeedbackHTML() {
  if (lastSentSlow) return `<p class="fb-slow">Too slow!</p>`;
  return lastSentOK
    ? `<p class="fb-correct">✓ Correct</p>`
    : `<p class="fb-wrong">✗ Incorrect</p>`;
}


// ================================================================
//  INIT JSPSYCH
// ================================================================
const jsPsych = initJsPsych({
  on_finish: function () {
    const last = jsPsych.data.get().last(1).values()[0] || {};
    const ok = last.success === true;
    const back = 'index.html' + (PID ? '?pid=' + encodeURIComponent(PID) : '');
    if (ok) { try { localStorage.setItem('wm_done_' + PID + '_' + TASK_NAME, new Date().toISOString()); } catch (e) {} }
    const backup = ok ? '' : `
        <p style="color:#b71c1c;font-weight:bold;">Hmm, your data did not upload.</p>
        <p>Please click below to download a copy and send it to the lab.</p>
        <p><button id="dl-backup" style="font-size:1em;padding:10px 24px;cursor:pointer;">Download my data</button></p>`;
    document.body.innerHTML = `
      <div style="font-family:Arial;text-align:center;padding:80px;line-height:1.6;">
        <h2>${TASK_NAME} complete</h2>
        ${ok ? '<p>Your data has been saved. Thank you!</p>' : backup}
        <p style="margin-top:24px;"><a href="${back}">&larr; Back to the task list</a></p>
      </div>`;
    if (!ok) {
      document.getElementById('dl-backup').onclick = () => {
        const blob = new Blob([jsPsych.data.get().csv()], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = getFilename(); a.click();
      };
    }
  }
});

const timeline = [];
const PROC = { field: 'sent_correct', answer: d => `<p class="ep-q">This sentence makes sense.</p>`, buttons: [['TRUE','j'],['FALSE','f']] };
// --- Lab setup: task label, participant ID from link (?pid=XX), readable filename ---
const TASK_NAME    = 'RSpan';
const URL_PID      = (new URLSearchParams(window.location.search).get('pid') || '').trim();
const SESSION_DATE = new Date().toISOString().slice(0, 10);
let   PID          = URL_PID;
const RAND_ID      = jsPsych.randomization.randomID(6);
jsPsych.data.addProperties({ task_name: TASK_NAME, session_date: SESSION_DATE, task_version: EP.VERSION });
const safeName     = x => String(x).replace(/[^A-Za-z0-9_-]/g, '_');
const getFilename  = () => `${TASK_NAME}_${safeName(PID || 'noID')}_${SESSION_DATE}_${RAND_ID}.csv`;


// ================================================================
//  PARTICIPANT ID
// ================================================================
if (URL_PID) {
  jsPsych.data.addProperties({ participant_id: URL_PID });
} else timeline.push({
  type: jsPsychSurveyText,
  questions: [{
    prompt:   'Please enter your Participant ID:',
    name:     'pid',
    required: true
  }],
  on_finish: d => { PID = String(d.response.pid).trim(); jsPsych.data.addProperties({ participant_id: PID }); }
});


// ================================================================
//  PART 1 — SENTENCE PRACTICE ALONE
// ================================================================
timeline.push({
  type:     jsPsychHtmlKeyboardResponse,
  stimulus: `<div class="instr">
    <h2>Part 1: Sentence Practice</h2>
    <p>You will read a sentence and decide whether it <strong>makes sense</strong>.</p>
    <p>Example of a sentence that makes sense:<br>
       <em>"The dog chased the cat around the yard."</em></p>
    <p>Example of a sentence that does NOT make sense:<br>
       <em>"The bicycle ate a large piece of pizza."</em></p>
    <p>Read the sentence, then <strong>click the mouse</strong>. Then click <strong>TRUE</strong> if it makes sense or <strong>FALSE</strong> if it does not.</p>
    <p>Try to be as <strong>fast and accurate</strong> as possible.
       You will read 15 practice sentences.</p>
    <br><p style="color:#888">Press any key to begin.</p>
  </div>`,
  choices: 'ALL_KEYS'
});

for (let i = 0; i < 15; i++) {
  const sent = pracSentence(i);
  timeline.push(EP.proc({
    type:     jsPsychHtmlKeyboardResponse,
    stimulus: sentenceTrialHTML(sent.text, false),
    choices:  ['f', 'j'],
    data:     { phase: 'sent_practice', correct_key: sent.correct ? 'j' : 'f', makes_sense: sent.correct },
    on_finish: function (d) {
      d.sent_correct = d.response === d.correct_key;
      lastSentOK   = d.sent_correct;
      lastSentSlow = false;
      if (d.sent_correct) practiceCorrect++;
      practiceRTs.push(d.rt);
    }
  }, PROC));
  timeline.push({
    type:           jsPsychHtmlKeyboardResponse,
    stimulus:       () => sentFeedbackHTML(),
    choices:        'NO_KEYS',
    trial_duration: FEEDBACK_MS
  });
}

// Compute individual time limit
timeline.push({
  type: jsPsychCallFunction,
  func: function () {
    const n    = practiceRTs.length;
    const mean = practiceRTs.reduce((a, b) => a + b, 0) / n;
    const sd   = Math.sqrt(practiceRTs.map(x => Math.pow(x - mean, 2)).reduce((a, b) => a + b, 0) / n);
    sentTimeLimit = Math.round(Math.max(1000, mean + 2.5 * sd));
  }
});

timeline.push({
  type:     jsPsychHtmlKeyboardResponse,
  stimulus: function () {
    const acc = Math.round((practiceCorrect / 15) * 100);
    const msg = acc < 85
      ? `<p style="color:#b71c1c;font-weight:bold;">
           Your accuracy was ${acc}%. Please try to be more careful —
           you need at least <strong>85%</strong> accuracy on the sentences.</p>`
      : `<p style="color:#2e7d32;font-weight:bold;">
           Your accuracy was ${acc}% — great job!</p>`;
    return `<div class="instr">
      <h2>Sentence Practice Complete</h2>${msg}
      <p>In the main task, each sentence will have a time limit based on your
         practice speed.</p>
      <br><p style="color:#888">Press any key to continue.</p>
    </div>`;
  },
  choices: 'ALL_KEYS'
});


// ================================================================
//  PART 2 — LETTER PRACTICE ALONE
// ================================================================
timeline.push({
  type:     jsPsychHtmlKeyboardResponse,
  stimulus: `<div class="instr">
    <h2>Part 2: Letter Practice</h2>
    <p>Next, you will practice remembering letters.</p>
    <p>A letter will appear briefly on screen — try to remember it.</p>
    <p>After all the letters in a set, a grid will appear.
       Click the letters you saw <strong>in the order they appeared</strong>.</p>
    <p>You will practice with 4 sets of 2 or 3 letters.</p>
    <br><p style="color:#888">Press any key to begin.</p>
  </div>`,
  choices: 'ALL_KEYS'
});

for (const PSZ of [2, 2, 3, 3]) {
  const letters  = pickLetters(PSZ);
  const tLetters = [...letters];

  letters.forEach(l => {
    timeline.push({
      type:           jsPsychHtmlKeyboardResponse,
      stimulus:       `<div class="letter-box">${l}</div>`,
      choices:        'NO_KEYS',
      trial_duration: LETTER_MS,
      data:           { phase: 'letter_practice' }
    });
    timeline.push({
      type:           jsPsychHtmlKeyboardResponse,
      stimulus:       '<div style="height:80px"></div>',
      choices:        'NO_KEYS',
      trial_duration: FIXATION_MS
    });
  });

  timeline.push({
    type:    jsPsychHtmlKeyboardResponse,
    stimulus: recallHTML(PSZ),
    choices: 'NO_KEYS',
    on_load: () => setupRecall(tLetters),
    data:    { phase: 'recall_practice', target: tLetters.join('') }
  });

  timeline.push({
    type:           jsPsychHtmlKeyboardResponse,
    stimulus: function () {
      const last = jsPsych.data.get().filter({ phase: 'recall_practice' }).last(1).values()[0];
      if (!last) return '';
      return `<p style="font-size:1.3em;text-align:center;">You recalled ${last.partial_correct} out of ${last.set_size} letters correctly.</p>`;
    },
    choices:        'NO_KEYS',
    trial_duration: 2200
  });
}


// ================================================================
//  PART 3 — COMBINED PRACTICE
// ================================================================
timeline.push({
  type:     jsPsychHtmlKeyboardResponse,
  stimulus: `<div class="instr">
    <h2>Part 3: Combined Practice</h2>
    <p>Now you will do both together: read a sentence and judge it,
       then a letter will appear — remember it.</p>
    <p>After all items in a set, recall the letters <strong>in order</strong>. You will then see how you did on that set.</p>
    <p>The sentences have a <strong>time limit</strong> — answer quickly!
       You must maintain at least <strong>85% accuracy</strong> on the sentences.</p>
    <br><p style="color:#888">Press any key to begin.</p>
  </div>`,
  choices: 'ALL_KEYS'
});

[2, 2, 2].forEach(sz => {
  const letters  = pickLetters(sz);
  const tLetters = [...letters];

  for (let i = 0; i < sz; i++) {
    const sent = nextSentence();

    timeline.push(EP.proc({
      type:     jsPsychHtmlKeyboardResponse,
      stimulus: sentenceTrialHTML(sent.text, true),
      choices:  ['f', 'j'],
      on_start: trial => { trial.trial_duration = sentTimeLimit; },
      on_load:  startTimerBar,
      data:     { phase: 'sent_combined_practice', correct_key: sent.correct ? 'j' : 'f' },
      on_finish: function (d) {
        lastSentSlow   = d.response === null;
        lastSentOK     = !lastSentSlow && d.response === d.correct_key;
        d.sent_correct = lastSentOK;
        d.timed_out    = lastSentSlow;
      }
    }, PROC));

    timeline.push({
      type:           jsPsychHtmlKeyboardResponse,
      stimulus:       `<div class="letter-box">${letters[i]}</div>`,
      choices:        'NO_KEYS',
      trial_duration: LETTER_MS,
      data:           { phase: 'letter_combined_practice' }
    });
    timeline.push({
      type:           jsPsychHtmlKeyboardResponse,
      stimulus:       '<div style="height:80px"></div>',
      choices:        'NO_KEYS',
      trial_duration: FIXATION_MS
    });
  }

  timeline.push({
    type:    jsPsychHtmlKeyboardResponse,
    stimulus: recallHTML(sz),
    choices: 'NO_KEYS',
    on_load: () => setupRecall(tLetters),
    data:    { phase: 'recall_combined_practice', target: tLetters.join('') }
  });
  timeline.push(EP.setFeedback('Sentence', 'letters'));
});


// ================================================================
//  MAIN TASK
// ================================================================
timeline.push({
  type:     jsPsychHtmlKeyboardResponse,
  stimulus: `<div class="instr">
    <h2>Main Task — Begin</h2>
    <p>You are now ready for the main task.</p>
    <p>You will complete <strong>15 sets</strong>, each containing 3 to 7 items.</p>
    <p>Remember:</p>
    <p>• Judge each sentence as quickly and accurately as possible</p>
    <p>• Memorise each letter and its position in the sequence</p>
    <p>• When prompted, recall the letters in the order they appeared</p>
    <p>• Keep your sentence accuracy above 85%</p>
    <br><p style="color:#888">Press any key to begin.</p>
  </div>`,
  choices: 'ALL_KEYS'
});

MAIN_SIZES.forEach((sz, setIdx) => {
  const letters  = pickLetters(sz);
  const tLetters = [...letters];

  for (let i = 0; i < sz; i++) {
    const sent = nextSentence();

    timeline.push(EP.proc({
      type:     jsPsychHtmlKeyboardResponse,
      stimulus: `
        ${sentenceTrialHTML(sent.text, true)}`,
      choices:  ['f', 'j'],
      on_start: trial => { trial.trial_duration = sentTimeLimit; },
      on_load:  startTimerBar,
      data: {
        task:          'sent_main',
        sentence:      sent.text,
        correct_key:   sent.correct ? 'j' : 'f',
        makes_sense:   sent.correct,
        set_index:     setIdx,
        item_index:    i,
        set_size:      sz,
        target_letter: letters[i]
      },
      on_finish: function (d) {
        lastSentSlow   = d.response === null;
        lastSentOK     = !lastSentSlow && d.response === d.correct_key;
        d.sent_correct = lastSentOK;
        d.timed_out    = lastSentSlow;
      }
    }, PROC));

    timeline.push({
      type:           jsPsychHtmlKeyboardResponse,
      stimulus:       `<div class="letter-box">${letters[i]}</div>`,
      choices:        'NO_KEYS',
      trial_duration: LETTER_MS,
      data: {
        task:       'letter_main',
        letter:     letters[i],
        set_index:  setIdx,
        item_index: i,
        set_size:   sz
      }
    });
    timeline.push({
      type:           jsPsychHtmlKeyboardResponse,
      stimulus:       '<div style="height:80px"></div>',
      choices:        'NO_KEYS',
      trial_duration: FIXATION_MS
    });
  }

  timeline.push({
    type:    jsPsychHtmlKeyboardResponse,
    stimulus: recallHTML(sz),
    choices: 'NO_KEYS',
    on_load: () => setupRecall(tLetters),
    data:    {
      task:       'recall_main',
      target:     tLetters.join(''),
      set_size:   sz,
      set_index:  setIdx
    }
  });
  timeline.push(EP.setFeedback('Sentence', 'letters'));
});


// ================================================================
//  COMPUTE SCORES
// ================================================================
timeline.push({
  type: jsPsychCallFunction,
  func: function () {
    const recallTrials = jsPsych.data.get().filter({ task: 'recall_main' }).values();
    const sentTrials   = jsPsych.data.get().filter({ task: 'sent_main'   }).values();

    finalPartial  = recallTrials.reduce((s, d) => s + (d.partial_correct  || 0), 0);
    finalAbsolute = recallTrials.reduce((s, d) => s + (d.absolute_correct || 0), 0);
    finalSentAcc  = sentTrials.length > 0
      ? Math.round((sentTrials.filter(d => d.sent_correct).length / sentTrials.length) * 100)
      : 0;
  },
  on_finish: function (d) {
    d.trial_type          = 'summary';
    d.partial_span_score  = finalPartial;
    d.absolute_span_score = finalAbsolute;
    d.sent_accuracy_main  = finalSentAcc;
  }
});


// ================================================================
//  END SCREEN
// ================================================================
timeline.push({
  type:           jsPsychHtmlKeyboardResponse,
  stimulus: function () {
    return `<div class="instr" style="text-align:center;">
      <h2>Task Complete!</h2>
      <p>Thank you for participating.</p>
      <p style="margin-top:18px;">
        <strong>Sentence accuracy (main task):</strong> ${finalSentAcc}%
      </p>
      <p style="color:#888;font-size:0.95em;margin-top:16px;">Saving your data&hellip;</p>
    </div>`;
  },
  choices:        'NO_KEYS',
  trial_duration: 2500
});


// ================================================================
//  SAVE VIA DATAPIPE → GOOGLE DRIVE
// ================================================================
timeline.push({
  type:          jsPsychPipe,
  action:        'save',
  experiment_id: PIPE_ID,
  filename:      () => getFilename(),
  data_string:   () => jsPsych.data.get().csv()
});


// ================================================================
//  RUN
// ================================================================
jsPsych.run(timeline);
</script>
</body>
</html>
